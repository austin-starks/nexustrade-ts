name: Publish MCP Registry metadata

on:
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out metadata
        uses: actions/checkout@v4

      - name: Download MCP Publisher 1.8.1
        run: >-
          curl --fail --location --silent --show-error
          --output mcp-publisher.tar.gz
          https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz

      - name: Verify publisher checksum
        run: echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check

      - name: Extract publisher
        run: tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate metadata
        run: ./mcp-publisher validate

      # The registry rejects a duplicate version, and a subtree mirror push can
      # re-send server.json unchanged. Skip only when the live entry is identical.
      - name: Check whether this version is already published
        id: registry
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          url="https://registry.modelcontextprotocol.io/v0.1/servers/$(jq -rn --arg v "$name" '$v|@uri')/versions/$(jq -rn --arg v "$version" '$v|@uri')"
          status=$(curl --silent --show-error --output published.json --write-out '%{http_code}' "$url")
          case "$status" in
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              if diff -u <(jq -S .server published.json) <(jq -S . server.json); then
                echo "$name $version is already published with identical metadata."
                echo "published=true" >> "$GITHUB_OUTPUT"
              else
                echo "::error::$name $version is already published with different metadata. Bump version in server.json."
                exit 1
              fi
              ;;
            *)
              echo "::error::Registry lookup for $name $version returned HTTP $status."
              exit 1
              ;;
          esac

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.published == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Publish NexusTrade
        if: steps.registry.outputs.published == 'false'
        run: ./mcp-publisher publish
